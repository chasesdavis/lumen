[package]
name = "lumen-winfsp-shim"
version.workspace = true
edition.workspace = true
license.workspace = true

[target."cfg(windows)".build-dependencies]
winfsp = "0.13"

[dependencies]
lumen-core = { workspace = true }
lumen-fsprobe = { workspace = true }
lumen-storage-adapters = { path = "../../crates/lumen-storage-adapters" }
futures = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
clap = { workspace = true }

[features]
default = []
tracing-log = ["dep:tracing-subscriber"]

[target."cfg(windows)".dependencies]
winfsp = "0.13"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
bytes = { workspace = true }

