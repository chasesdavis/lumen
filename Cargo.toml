[workspace]
resolver = "2"
members = [
    "crates/lumen-core",
    "crates/lumen-storage-adapters",
    "crates/lumen-fsprobe",
    "crates/lumen-fs-adapter",
    "crates/lumen-fuse-shim",
    "crates/lumen-mcp-server",
    "crates/lumen-api-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
lumen-core = { path = "crates/lumen-core" }
lumen-fsprobe = { path = "crates/lumen-fsprobe" }
lumen-fs-adapter = { path = "crates/lumen-fs-adapter" }
lumen-api-server = { path = "crates/lumen-api-server" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
object_store = { version = "0.10", features = ["aws"] }
axum = "0.7"
jsonwebtoken = "9"
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
