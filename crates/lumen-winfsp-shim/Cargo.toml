[package]
name = "lumen-winfsp-shim"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
# Plain (not cfg(windows)): build scripts run on the HOST, so a
# windows-gated build-dep vanishes when cross-compiling from macOS.
# The script decides at runtime whether the target is windows.
winfsp = "0.13"

[dependencies]
lumen-core = { workspace = true }
lumen-fsprobe = { workspace = true }
lumen-storage-adapters = { path = "../../crates/lumen-storage-adapters" }
futures = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }

# Windows-only code path and packaging binary. Kept target-scoped so
# host builds do not flag them as unused.
[target."cfg(windows)".dependencies]
lumen-fs-adapter = { path = "../lumen-fs-adapter" }
tracing-subscriber = { workspace = true }
winfsp = "0.13"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
bytes = { workspace = true }


[features]
default = []
